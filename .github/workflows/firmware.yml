name: Firmware build

on:
  push:
    branches: [polivoks-duophonic]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache JieLi toolchain
        id: tc
        uses: actions/cache@v4
        with:
          path: C:\JL
          key: jieli-toolchain-2.5.3

      - name: Download JieLi toolchain installer
        if: steps.tc.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          curl.exe -fL --retry 3 --max-time 600 -o "$env:RUNNER_TEMP\jl.exe" https://jl-update.oss-cn-shenzhen.aliyuncs.com/2.5.3.exe
          Write-Host "download exit $LASTEXITCODE after $($sw.Elapsed)"
          $f = Get-Item "$env:RUNNER_TEMP\jl.exe"
          Write-Host "size: $($f.Length)"
          $b = [IO.File]::ReadAllBytes($f.FullName)
          $txt = [Text.Encoding]::ASCII.GetString($b, 0, [Math]::Min($b.Length, 4000000))
          foreach ($k in 'Nullsoft','Inno Setup','WiX','InstallShield','7z','Setup Factory') { Write-Host "$k : $($txt.Contains($k))" }

      - name: Install JieLi toolchain 2.5.3
        if: steps.tc.outputs.cache-hit != 'true'
        shell: pwsh
        timeout-minutes: 15
        run: |
          # 7-Zip showed Inno Setup sections (.itext), so use Inno's unattended flags.
          # Diagnostics go to annotations (::notice::) because job logs may not be downloadable.
          $exe = "$env:RUNNER_TEMP\jl.exe"
          $log = "$env:RUNNER_TEMP\jl-install.log"
          $p = Start-Process $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/DIR=C:\JL',"/LOG=$log" -PassThru
          if (!$p.WaitForExit(420000)) { Write-Host "::warning title=install timed out::killing"; Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          else { Write-Host "::notice title=installer exit::$($p.ExitCode)" }
          if (Test-Path $log) { $tail = (Get-Content $log -Tail 15) -join ' | '; Write-Host "::notice title=installer log tail::$tail" }
          $clang = Get-ChildItem C:\ -Recurse -Filter clang.exe -ErrorAction SilentlyContinue -Depth 4 | Where-Object { $_.FullName -like '*pi32*' } | Select-Object -First 1
          if (!$clang) {
            $top = (Get-ChildItem C:\JL -ErrorAction SilentlyContinue | Select-Object -First 20 | ForEach-Object Name) -join ', '
            Write-Host "::error title=no pi32 clang.exe::C:\JL contains: $top"
            throw 'pi32 clang.exe not found after install'
          }
          Write-Host "::notice title=clang found::$($clang.FullName)"

      - name: Build firmware
        shell: pwsh
        run: ./sdk/Build.ps1 -FirmwareOnly -Toolchain 'C:\JL\pi32'

      - name: Build web preview
        shell: pwsh
        run: ./tools/Build-Web.ps1 -LocalPreview

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fm1-build
          path: build/
          if-no-files-found: warn
