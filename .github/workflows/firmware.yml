name: Firmware build

on:
  push:
    branches: [polivoks-duophonic]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache JieLi toolchain
        id: tc
        uses: actions/cache@v4
        with:
          path: C:\JL
          key: jieli-toolchain-2.5.3

      - name: Download JieLi toolchain installer
        if: steps.tc.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          curl.exe -fL --retry 3 --max-time 600 -o "$env:RUNNER_TEMP\jl.exe" https://jl-update.oss-cn-shenzhen.aliyuncs.com/2.5.3.exe
          Write-Host "download exit $LASTEXITCODE after $($sw.Elapsed)"
          $f = Get-Item "$env:RUNNER_TEMP\jl.exe"
          Write-Host "size: $($f.Length)"
          $b = [IO.File]::ReadAllBytes($f.FullName)
          $txt = [Text.Encoding]::ASCII.GetString($b, 0, [Math]::Min($b.Length, 4000000))
          foreach ($k in 'Nullsoft','Inno Setup','WiX','InstallShield','7z','Setup Factory') { Write-Host "$k : $($txt.Contains($k))" }

      - name: Install JieLi toolchain 2.5.3
        if: steps.tc.outputs.cache-hit != 'true'
        shell: pwsh
        timeout-minutes: 10
        run: |
          function Try-Install($label, $args) {
            Write-Host "== $label"
            $p = Start-Process "$env:RUNNER_TEMP\jl.exe" -ArgumentList $args -PassThru
            if (!$p.WaitForExit(240000)) { Write-Host "$label timed out; killing"; Stop-Process -Id $p.Id -Force; Get-Process | Where-Object { $_.Path -like "*$env:RUNNER_TEMP*" } | Stop-Process -Force -ErrorAction SilentlyContinue }
            else { Write-Host "$label exit $($p.ExitCode)" }
            Test-Path C:\JL\pi32\bin\clang.exe
          }
          $ok = Try-Install 'NSIS' @('/S','/D=C:\JL')
          if (!$ok) { $ok = Try-Install 'Inno' @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\JL') }
          if (!$ok) { $ok = Try-Install 'MSI-style' @('/quiet','/qn','INSTALLDIR=C:\JL') }
          if (!$ok) {
            Get-ChildItem C:\ -Directory | Select-Object -ExpandProperty FullName
            Get-ChildItem C:\JL -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 50 FullName
            throw 'Silent install did not produce C:\JL\pi32\bin\clang.exe'
          }

      - name: Build firmware
        shell: pwsh
        run: ./sdk/Build.ps1 -FirmwareOnly -Toolchain 'C:\JL\pi32'

      - name: Build web preview
        shell: pwsh
        run: ./tools/Build-Web.ps1 -LocalPreview

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fm1-build
          path: build/
          if-no-files-found: warn
