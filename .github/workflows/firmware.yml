name: Firmware build

on:
  push:
    branches: [polivoks-duophonic]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache JieLi toolchain
        id: tc
        uses: actions/cache@v4
        with:
          path: C:\JL
          key: jieli-toolchain-2.5.3

      - name: Download JieLi toolchain installer
        if: steps.tc.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          curl.exe -fL --retry 3 --max-time 600 -o "$env:RUNNER_TEMP\jl.exe" https://jl-update.oss-cn-shenzhen.aliyuncs.com/2.5.3.exe
          Write-Host "download exit $LASTEXITCODE after $($sw.Elapsed)"
          $f = Get-Item "$env:RUNNER_TEMP\jl.exe"
          Write-Host "size: $($f.Length)"
          $b = [IO.File]::ReadAllBytes($f.FullName)
          $txt = [Text.Encoding]::ASCII.GetString($b, 0, [Math]::Min($b.Length, 4000000))
          foreach ($k in 'Nullsoft','Inno Setup','WiX','InstallShield','7z','Setup Factory') { Write-Host "$k : $($txt.Contains($k))" }

      - name: Install JieLi toolchain 2.5.3
        if: steps.tc.outputs.cache-hit != 'true'
        shell: pwsh
        timeout-minutes: 15
        run: |
          # The installer's type is undocumented and a GUI wizard hangs CI, so unpack it with 7-Zip.
          # Diagnostics go to annotations (::notice::) because job logs may not be downloadable.
          $exe = "$env:RUNNER_TEMP\jl.exe"
          $7z = 'C:\Program Files\7-Zip\7z.exe'
          $list = (& $7z l $exe 2>&1 | Out-String)
          $head = ($list -split "`n" | Select-Object -First 25) -join ' | '
          Write-Host "::notice title=7z list head::$head"
          $dirs = [regex]::Matches($list, 'pi32[^\s]*clang\.exe') | Select-Object -First 3 | ForEach-Object { $_.Value }
          Write-Host "::notice title=clang paths in archive::$($dirs -join ' ; ')"
          New-Item -ItemType Directory -Force C:\JL_extract | Out-Null
          & $7z x -y -oC:\JL_extract $exe | Select-Object -Last 3 | ForEach-Object { Write-Host $_ }
          $clang = Get-ChildItem C:\JL_extract -Recurse -Filter clang.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$clang) {
            $top = (Get-ChildItem C:\JL_extract | Select-Object -First 20 | ForEach-Object Name) -join ', '
            Write-Host "::error title=no clang.exe after 7z::top-level: $top"
            throw 'clang.exe not found after extraction'
          }
          Write-Host "::notice title=clang found::$($clang.FullName)"
          $pi32 = Split-Path -Parent (Split-Path -Parent $clang.FullName)
          New-Item -ItemType Directory -Force C:\JL | Out-Null
          Move-Item $pi32 C:\JL\pi32
          Write-Host "::notice title=toolchain moved::$((Get-ChildItem C:\JL\pi32 | ForEach-Object Name) -join ', ')"

      - name: Build firmware
        shell: pwsh
        run: ./sdk/Build.ps1 -FirmwareOnly -Toolchain 'C:\JL\pi32'

      - name: Build web preview
        shell: pwsh
        run: ./tools/Build-Web.ps1 -LocalPreview

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fm1-build
          path: build/
          if-no-files-found: warn
