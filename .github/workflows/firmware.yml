name: Firmware build

on:
  push:
    branches: [polivoks-duophonic]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache JieLi toolchain
        id: tc
        uses: actions/cache@v4
        with:
          path: C:\JL
          key: jieli-toolchain-2.5.3

      - name: Download JieLi toolchain installer
        if: steps.tc.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          curl.exe -fL --retry 3 --max-time 600 -o "$env:RUNNER_TEMP\jl.exe" https://jl-update.oss-cn-shenzhen.aliyuncs.com/2.5.3.exe
          Write-Host "download exit $LASTEXITCODE after $($sw.Elapsed)"
          $f = Get-Item "$env:RUNNER_TEMP\jl.exe"
          Write-Host "size: $($f.Length)"
          $b = [IO.File]::ReadAllBytes($f.FullName)
          $txt = [Text.Encoding]::ASCII.GetString($b, 0, [Math]::Min($b.Length, 4000000))
          foreach ($k in 'Nullsoft','Inno Setup','WiX','InstallShield','7z','Setup Factory') { Write-Host "$k : $($txt.Contains($k))" }

      - name: Install JieLi toolchain 2.5.3
        if: steps.tc.outputs.cache-hit != 'true'
        shell: pwsh
        timeout-minutes: 15
        run: |
          # The installer is Inno Setup but pops a Chinese GUI message box that hangs CI
          # (run 40906427190). Unpack it with innoextract instead of running it.
          # Diagnostics go to annotations (::notice::) because job logs may not be downloadable.
          $exe = "$env:RUNNER_TEMP\jl.exe"
          choco install innoextract -y --no-progress | Select-Object -Last 3 | ForEach-Object { Write-Host $_ }
          $ie = (Get-Command innoextract -ErrorAction SilentlyContinue).Source
          Write-Host "::notice title=innoextract::$ie"
          New-Item -ItemType Directory -Force C:\JL_extract | Out-Null
          $out = (& innoextract --silent --extract --output-dir C:\JL_extract $exe 2>&1 | Out-String)
          Write-Host "::notice title=innoextract output::$(($out -split "`n" | Select-Object -Last 8) -join ' | ')"
          $clang = Get-ChildItem C:\JL_extract -Recurse -Filter clang.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like '*pi32*' } | Select-Object -First 1
          if (!$clang) {
            $top = (Get-ChildItem C:\JL_extract -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 30 | ForEach-Object { $_.FullName.Replace('C:\JL_extract','') }) -join ', '
            Write-Host "::error title=no pi32 clang.exe::extract contains: $top"
            throw 'pi32 clang.exe not found after extraction'
          }
          Write-Host "::notice title=clang found::$($clang.FullName)"
          $pi32 = Split-Path -Parent (Split-Path -Parent $clang.FullName)
          New-Item -ItemType Directory -Force C:\JL | Out-Null
          Move-Item $pi32 C:\JL\pi32
          Write-Host "::notice title=toolchain moved::$((Get-ChildItem C:\JL\pi32 | ForEach-Object Name) -join ', ')"

      - name: Build firmware
        id: fw
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\fw-build.log"
          try { ./sdk/Build.ps1 -FirmwareOnly -Toolchain 'C:\JL\pi32' *>&1 | Tee-Object -FilePath $log }
          catch { $_ | Out-String | Tee-Object -FilePath $log -Append; throw }

      - name: Report build errors as annotations
        if: failure() && steps.fw.outcome == 'failure'
        shell: pwsh
        run: |
          # Job logs are not downloadable, so surface the tail of the build log in annotations.
          $lines = Get-Content "$env:RUNNER_TEMP\fw-build.log" -Tail 40 -ErrorAction SilentlyContinue
          $err = @($lines | Where-Object { $_ -match 'error|Error|throw|Audio callback|outside|absent|undefined' })
          $msg = (($err + '---' + $lines) | ForEach-Object { $_.Trim() } | Select-Object -First 45) -join ' | '
          Write-Host "::error title=firmware build log::$msg"

      - name: Report image size breakdown
        if: always() && steps.fw.outcome != 'skipped'
        shell: pwsh
        run: |
          # Annotations only: job logs and artifacts are not downloadable from this environment.
          $map = Get-ChildItem build -Recurse -Filter sdk.map -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$map) { Write-Host "::warning title=size report::no sdk.map"; exit 0 }
          $by = @{}; $sec = @()
          foreach ($l in [IO.File]::ReadLines($map.FullName)) {
            if ($l -match '^\s+(\.[^\s]+)\s+0x([0-9a-fA-F]+)\s+0x([0-9a-fA-F]+)\s+(.+?)\s*$') {
              $size = [Convert]::ToInt64($Matches[3],16); if ($size -le 0) { continue }
              $file = $Matches[4] -replace '^.*[\\/]', ''
              if ($file -match '\(([^)]+)\)$') { $file = $Matches[1] }
              $by[$file] += $size; $sec += [pscustomobject]@{n=$Matches[1];s=$size;f=$file}
            }
          }
          $top = ($by.GetEnumerator() | Sort-Object Value -Descending | Select-Object -First 22 | ForEach-Object { "$($_.Key)=$($_.Value)" }) -join ' | '
          Write-Host "::notice title=size by object::$top"
          $secsum = ($sec | Group-Object n | ForEach-Object { [pscustomobject]@{n=$_.Name;s=($_.Group | Measure-Object s -Sum).Sum} } | Sort-Object s -Descending | Select-Object -First 16 | ForEach-Object { "$($_.n)=$($_.s)" }) -join ' | '
          Write-Host "::notice title=size by section name::$secsum"
          $fm = (Select-String -Path "$env:RUNNER_TEMP\fw-build.log" -Pattern 'FM1:' -ErrorAction SilentlyContinue | Select-Object -First 1).Line
          Write-Host "::notice title=image line::$fm"
          $mine = ($by.GetEnumerator() | Where-Object { $_.Key -match 'polivoks' } | ForEach-Object { "$($_.Key)=$($_.Value)" }) -join ' | '
          Write-Host "::notice title=polivoks objects::$mine"
          $big = ($sec | Sort-Object s -Descending | Select-Object -First 22 | ForEach-Object { "$($_.n)=$($_.s)($($_.f))" }) -join ' | '
          Write-Host "::notice title=largest sections::$big"

      - name: Build web preview
        shell: pwsh
        run: ./tools/Build-Web.ps1 -LocalPreview

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fm1-build
          path: build/
          if-no-files-found: warn
